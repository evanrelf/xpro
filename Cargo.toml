[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
eframe = "0.37.0"
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rawler = "0.8.0"
rayon = "1.12.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
xpro-core = { path = "crates/xpro-core/" }
