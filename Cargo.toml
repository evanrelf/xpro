[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
eframe = "0.37.0"
egui = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }
fastrand = "2.5.0"
hegeltest = { version = "0.52.0", features = ["static-engine"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rawler = "0.8.0"
rayon = "1.12.0"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
xpro-core = { path = "crates/xpro-core/" }

[profile.dev.package.hegeltest]
opt-level = 3

[profile.dev.package.hegeltest-c]
opt-level = 3
